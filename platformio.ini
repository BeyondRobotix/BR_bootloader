; BR_bootloader -- PlatformIO + Arduino framework bootloader for BR boards.
;
; Phase 1+2: MicroNode (STM32L431, bxCAN, 256 KB flash, 40 KB bootloader region).
; Phase 3:   MicroNodePlus (STM32H723, FDCAN, 1024 KB) and CoreNode (STM32H743,
;            FDCAN, 2048 KB) -- both share the same H7 linker (128 KB sector-0
;            bootloader region at 0x08000000, app at 0x08020000).
;
; Boards + variants are sourced from the br-stm32 platform in br_platformio_hwdef.

[platformio]
default_envs = Micro-Node-Bootloader

[env]
platform = https://github.com/BeyondRobotix/br_platformio_hwdef.git
framework = arduino
upload_protocol = stlink
debug_tool = stlink
debug_build_flags = -O0 -g
debug_init_break = tbreak none
lib_deps = https://github.com/BeyondRobotix/libArduinoDroneCAN.git#v1.0.0

; Flags shared by every bootloader build. Size-optimised, GC unused sections.
[bootloader_common]
build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wno-error=deprecated-declarations

[env:Micro-Node-Bootloader]
board = MicroNode
board_build.ldscript = linker/bootloader_l4.ld
build_flags = ${bootloader_common.build_flags}

; H7 bootloaders strip CANFD support: the bootloader stays classic-CAN-only so it
; remains ABI-compatible with classic nodes on the bus and keeps the libcanard
; frame buffer at 8 bytes (lower memory footprint).
[env:Micro-Node-Plus-Bootloader]
board = MicroNodePlus
board_build.ldscript = linker/bootloader_h7.ld
build_flags = ${bootloader_common.build_flags}
build_unflags = -DCANARD_ENABLE_CANFD=1

[env:Core-Node-Bootloader]
board = CoreNode
board_build.ldscript = linker/bootloader_h7.ld
build_flags = ${bootloader_common.build_flags}
build_unflags = -DCANARD_ENABLE_CANFD=1

; UNVERIFIED -- STM32C532 (MicroNodeC5). No PlatformIO registry access was
; available to build/test this. See br_platformio_hwdef's MicroNodeC5 board
; and libArduinoDroneCAN's canC5xx driver for the rest of this port.
;
; lib_deps overridden to the port branch (not yet in any tagged release --
; [env]'s v1.0.0 pin predates the canC5xx driver). Repoint at a real tag
; once libArduinoDroneCAN cuts one that includes STM32C5 support.
[env:Micro-Node-C5-Bootloader]
board = MicroNodeC5
board_build.ldscript = linker/bootloader_c5.ld
build_flags = ${bootloader_common.build_flags}
build_unflags = -DCANARD_ENABLE_CANFD=1
lib_deps = https://github.com/BeyondRobotix/libArduinoDroneCAN.git#claude/stm32c532-arduino-drone-port-us8hi5
